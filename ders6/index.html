<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <label id="countLabel">0</label><br>  <!--ekranda başlangıç değeri 0 olan sayıyı gösterir.--> 
    <div id="btnContainer">
        <button id="increaseBtn" class="buttons">Increase</button> <!--sayaç değerini 1arttırmak için kullanılır.-->
        <button id="decreaseBtn" class="buttons">Decrease</button> <!--sayaç değerini 1 azaltmak için kullanılır.-->
        <button id="resetBtn" class="buttons">Reset</button> <!--sayaç değerini 0'a sıfırlamak için kullanılır.-->
    </div>
    <!--ekranda sayaç değerini gösteren label ve butonları içeren bir div oluşturur.-->
    
    <script src="index.js"></script>
</body>
</html>
